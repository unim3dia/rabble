<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabble spot title</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  /* Title frames for the short commercials: one thought, big and plain, on
     black (or over a picture), the way product ads set their words. */
  :root { --ink: #fbf7f2; --soft: rgba(251, 247, 242, 0.62); --font: "Figtree", system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: var(--font); }
  .frame { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 34px; }
  .words { font-weight: 800; font-size: 46px; line-height: 1.04; letter-spacing: -0.035em; text-wrap: balance; }
  .bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scrim { position: fixed; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.65) 100%); }
  .low { justify-content: flex-end; padding-bottom: 92px; }
  .figure { width: 300px; height: auto; filter: drop-shadow(0 26px 40px rgba(0,0,0,.45)); margin-bottom: 34px; }
  .warm { background: radial-gradient(80% 55% at 50% 42%, #3b2a4f 0%, #120c1c 70%, #000 100%); }
  .lockup img { width: 300px; height: auto; }
  .lockup .line { margin-top: 18px; font-weight: 600; font-size: 22px; letter-spacing: -0.01em; }
  .lockup .url { margin-top: 34px; font-weight: 500; font-size: 15px; color: var(--soft); letter-spacing: 0.01em; }
</style>
</head>
<body>
<script>
  // ?words=...  plain title on black
  // ?words=...&bg=picture  title low over a full-screen picture
  // ?words=...&figure=picture  a figure in a soft light, title under it
  // ?lockup=line  the Rabble wordmark, a line and the address
  const q = new URLSearchParams(location.search);
  const el = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls || "", textContent: text || "" });
  const frame = el("main", "frame");
  if (q.get("lockup") !== null) {
    frame.classList.add("lockup");
    const img = Object.assign(document.createElement("img"), { src: "../../app/rabble-title.webp", alt: "Rabble" });
    frame.append(img, el("div", "line", q.get("lockup")), el("div", "url", "unim3dia.github.io/rabble"));
  } else {
    if (q.get("bg")) {
      document.body.append(Object.assign(document.createElement("img"), { className: "bg", src: q.get("bg") }), el("div", "scrim"));
      frame.classList.add("low");
    }
    if (q.get("figure")) {
      document.body.classList.add("warm");
      frame.append(Object.assign(document.createElement("img"), { className: "figure", src: q.get("figure") }));
    }
    frame.append(el("div", "words", q.get("words") || ""));
  }
  document.body.append(frame);
  Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))])
    .then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>
